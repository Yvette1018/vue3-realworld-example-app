name: deploy vue
on:
    push:
        branches:
            - prod

jobs:
    deploy-app:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10
                  run_install: false

            - name: setup node 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "pnpm"

            - name: build
              run: |
                  pnpm install --no-frozen-lockfile
                  pnpm build

            - name: copy dist to server
              uses: appleboy/scp-action@master
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.SSH_USER_NAME }}
                  key: ${{ secrets.SSH_KEY }}
                  source: "./dist/*"
                  target: "/var/www/html"
                  strip_components: 1
